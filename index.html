<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Travel with Wolves</title>
    <meta
      name="description"
      content="Travel with Wolves: group tours, flights and hotels."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Philosopher:wght@700&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip" href="#app" data-i18n="skip">Skip to content</a>

    <header class="site-header">
      <div class="wrap bar">
        <a class="brand" href="#/" aria-label="Travel with Wolves">
          <span id="logo" class="logo"></span
          ><span class="wm">Travel with Wolves</span>
        </a>
        <nav id="nav" aria-label="Main">
          <a href="#/" data-nav="home" data-i18n="home">Home</a>
          <a href="#/tours" data-nav="tours" data-i18n="tours">Tours</a>
          <a href="#/countries" data-nav="countries" data-i18n="countries"
            >Countries</a
          >
          <a href="#/hotels" data-nav="hotels" data-i18n="hotels">Hotels</a>
          <a href="#/flights" data-nav="flights" data-i18n="flights">Flights</a>
          <a href="#/about" data-nav="about" data-i18n="about">About us</a>
          <a href="#/contacts" data-nav="contacts" data-i18n="contacts"
            >Contacts</a
          >
        </nav>
        <div class="tools">
          <label class="visually-hidden" for="langSel" data-i18n="langL"
            >Language</label
          >
          <select id="langSel" class="sel">
            <option value="en">EN</option>
            <option value="ru">RU</option>
            <option value="uz">UZ</option>
          </select>
          <button
            class="iconbtn"
            id="themeBtn"
            data-act="theme"
            type="button"
            aria-label="Toggle theme"
          >
            <svg
              class="i-sun"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg
              class="i-moon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <button
            class="btn small"
            id="loginBtn"
            data-act="auth"
            data-v="login"
            type="button"
            data-i18n="login"
          >
            Log in
          </button>
          <a class="btn small ghost" id="accBtn" href="#/account" hidden></a>
          <button
            class="burger"
            id="burger"
            data-act="burger"
            type="button"
            aria-expanded="false"
            aria-controls="nav"
            aria-label="Menu"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="wrap foot-in">
        <div>
          <div class="brand">
            <span id="logo2" class="logo"></span
            ><span class="wm">Travel with Wolves</span>
          </div>
          <p class="mute" data-i18n="footTag">Find your pack.</p>
        </div>
        <nav class="foot-nav" aria-label="Footer">
          <a href="#/tours" data-i18n="tours">Tours</a>
          <a href="#/hotels" data-i18n="hotels">Hotels</a>
          <a href="#/flights" data-i18n="flights">Flights</a>
          <a href="#/about" data-i18n="about">About us</a>
          <a href="#/contacts" data-i18n="contacts">Contacts</a>
        </nav>
      </div>
      <div class="wrap copy">
        <span
          >© <span id="year"></span> Travel with Wolves.
          <span data-i18n="rights">All rights reserved.</span></span
        >
      </div>
    </footer>

    <div id="modal" class="modal" hidden>
      <div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <button class="x" data-act="close" type="button" aria-label="Close">
          ×
        </button>
        <div id="modalBody"></div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
